<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="redGlowLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E28" />
      <stop offset="100%" stop-color="#D90014" />
    </linearGradient>
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1115" />
      <stop offset="100%" stop-color="#22252B" />
    </linearGradient>
  </defs>

  <!-- Aerodynamic Headlight / Eye Symbol for Light BG -->
  <g transform="translate(10, 8)">
    <path d="M 5 28 C 30 10, 80 8, 125 30 C 95 38, 70 34, 45 36 C 30 38, 18 34, 5 28 Z" fill="url(#darkMetal)" />
    <path d="M 28 42 C 48 54, 75 56, 110 33 C 85 45, 55 46, 38 38 Z" fill="url(#darkMetal)" />
    <path d="M 40 33 C 46 25, 62 25, 74 34 C 64 43, 48 42, 40 33 Z" fill="url(#redGlowLight)" />
    <ellipse cx="56" cy="33" rx="5" ry="4" fill="#150002" />
    <circle cx="58" cy="31" r="1.5" fill="#FFFFFF" opacity="0.9" />
    <path d="M 115 32 L 138 29 L 118 36 Z" fill="url(#redGlowLight)" />
  </g>

  <!-- Typography: SECRET PARTS -->
  <g transform="translate(155, 48)">
    <text x="0" y="0" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-style="italic" font-size="34" letter-spacing="1.5" fill="url(#darkMetal)">
      SECRET
    </text>
    <text x="0" y="22" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-style="italic" font-size="24" letter-spacing="3.5" fill="url(#redGlowLight)">
      PARTS
    </text>
  </g>
